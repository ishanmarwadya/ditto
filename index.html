<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="brand-mark" aria-hidden="true">d.</div><div><strong>ditto</strong><small>on your side</small></div></div>
    <nav class="nav" id="desktopNav"></nav>
    <div class="sidebar-bottom"><b>Our independence promise</b><p>Your verdict is explained. The shortlist is not for sale. A person owns your claim.</p><button type="button" data-action="charter">Read the five rules</button></div>
  </aside>
  <main class="shell" id="main">
    <header class="topbar"><div class="eyebrow">Ditto On Your Side <span style="color:#c4c0dc;margin:0 6px">/</span> Interactive concept</div><div class="top-actions"><span class="demo-pill"><span class="dot"></span> ILLUSTRATIVE DEMO</span><button class="round-btn" type="button" data-action="charter">Independence charter</button></div></header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav>
<div class="notice" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" id="closeModal" aria-label="Close dialog">×</button></div><div id="modalContent"></div></div></div>
<script>
(()=>{
  'use strict';
  const icons={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l3 3v14H5V3h3"/><path d="M14 3v4h5M8 12h8m-8 4h5"/></svg>',choose:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>',claim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6l8-4Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',inside:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l2-2"/></svg>'};
  const views=[['check','Check'],['choose','Choose'],['claim','Claim'],['inside','Ditto Inside']];
  const state={view:'check',scenario:{product:'Savings-linked life plan',cover:10,income:12,premium:1,dependants:'Yes'},result:null,selected:'A',claimExpanded:false,claimResolved:true,consent:false,consentScope:false};
  const planData=[{id:'A',score:8.6,cover:'₹1 Cr term + ₹15L health',detail:'Strong claims track record · broad hospital network',why:'Highest illustrative Claims Index, suitable cover, and a broad hospital network.',earning:'Same illustrative distribution rate'},{id:'B',score:8.1,cover:'₹1 Cr term + ₹15L health',detail:'Slightly lower premium · narrower exclusions',why:'A lower illustrative premium, with more restrictions to review.',earning:'Same illustrative distribution rate'},{id:'C',score:7.4,cover:'₹1 Cr term + ₹10L health',detail:'Lower health cover · more claim friction',why:'Lower health cover than this family’s stated need and a weaker claims score.',earning:'Same illustrative distribution rate'}];
  const $=s=>document.querySelector(s);
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>n>=100?`₹${+(n/100).toFixed(2)} Cr`:`₹${+n.toFixed(1)}L`;
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3600)}
  function renderNav(){$('#desktopNav').innerHTML=views.map(([id,label])=>`${id==='inside'?'<div class="nav-divider"></div>':''}<button type="button" data-view="${id}" ${state.view===id?'aria-current="page"':''}>${icons[id]}<span>${label}</span></button>`).join('');$('#mobileNav').innerHTML=views.map(([id,label])=>`<button type="button" data-view="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}>${icons[id]}<span>${label}</span></button>`).join('')}
  function heading(kicker,title,desc,step){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="stage"><span></span>${step}</div></div>`}
  function evaluate(){const s=state.scenario,multiple=s.dependants==='Yes'?10:5,need=Math.max(50,s.income*multiple),gap=Math.max(0,need-s.cover),ratio=s.cover/need,burden=s.income?100*s.premium/s.income:0;let type='keep';if(ratio<.75||burden>12)type='fix';if(ratio<.25&&burden>15)type='switch';const rules=[];rules.push({good:ratio>=.75,title:ratio>=.75?'Cover meets the illustrative threshold':'Life cover falls short',text:`₹${s.cover}L proposed against an illustrative ₹${need}L need based on ${multiple}× annual income.`});rules.push({good:burden<=12,title:burden<=12?'Premium within the demo threshold':'Premium may strain your budget',text:`₹${s.premium}L per year is ${burden.toFixed(1)}% of stated annual income.`});rules.push({good:s.product==='Term cover',title:s.product==='Term cover'?'Protection is the primary purpose':'Separate protection from savings',text:s.product==='Term cover'?'Check exclusions, term, and beneficiary details before purchase.':'A savings-linked pitch can obscure how much protection you actually get.'});rules.push({good:true,title:'Read the actual policy wording',text:'A human adviser must confirm exclusions, charges, and the free-look period.'});state.result={need,gap,ratio,burden,type,rules}}
  function checkView(){if(!state.result)evaluate();const r=state.result,s=state.scenario;const titles={keep:'KEEP, after a human review',fix:'FIX BEFORE YOU SIGN',switch:'SWITCH OR REWORK THE PITCH'};return heading('01 / Before you sign','A second opinion on any pitch','Try the example from our case deck or change the details. The verdict updates from clear, visible rules.','Check any policy')+`<div class="grid"><section class="card pad"><div class="card-header"><h2>What were you offered?</h2><span class="small-tag">EXAMPLE INPUTS</span></div><form id="checkForm"><div class="field-grid"><div class="field wide"><label for="product">Policy type</label><select id="product" name="product"><option ${s.product==='Savings-linked life plan'?'selected':''}>Savings-linked life plan</option><option ${s.product==='Term cover'?'selected':''}>Term cover</option></select></div><div class="field"><label for="cover">Proposed life cover (₹ lakh)</label><input id="cover" name="cover" type="number" min="1" max="1000" step="1" value="${s.cover}" required></div><div class="field"><label for="income">Annual income (₹ lakh)</label><input id="income" name="income" type="number" min="1" max="1000" step="1" value="${s.income}" required></div><div class="field"><label for="premium">Annual premium (₹ lakh)</label><input id="premium" name="premium" type="number" min="0.01" max="100" step="0.01" value="${s.premium}" required></div><div class="field"><label for="dependants">Financial dependants</label><select id="dependants" name="dependants"><option ${s.dependants==='Yes'?'selected':''}>Yes</option><option ${s.dependants==='No'?'selected':''}>No</option></select></div></div><div class="actions"><button class="btn primary" type="submit">Review this pitch <span aria-hidden="true">→</span></button><button class="btn ghost" type="button" data-action="reset-check">Reset example</button></div><p class="micro" style="margin-top:12px">The prototype uses illustrative rules. It does not read a policy PDF or provide regulated advice.</p></form></section><section class="card pad"><div class="result-banner ${r.type}"><div class="result-top"><div class="verdict-symbol ${r.type}">${r.type==='keep'?'✓':'!'}</div><div><div class="eyebrow">Ditto Check · ${r.type.toUpperCase()}</div><h2>${titles[r.type]}</h2><p>${r.type==='keep'?'The input clears these demo checks. Confirm the full policy with an adviser.':'The pitch needs attention before you commit. Here is exactly why.'}</p></div></div></div><div class="metrics"><div class="metric"><b>${fmt(s.cover)}</b><span>Proposed cover</span></div><div class="metric"><b>${fmt(r.need)}</b><span>Illustrative need</span></div><div class="metric"><b>${fmt(r.gap)}</b><span>Cover gap</span></div></div><div class="progress" aria-label="${Math.round(r.ratio*100)} percent of illustrative need covered"><span style="width:${Math.min(100,Math.round(r.ratio*100))}%"></span></div><div class="rule-list">${r.rules.map(x=>`<div class="rule"><span class="rule-icon ${x.good?'good':''}">${x.good?'✓':'!'}</span><div><b>${x.title}</b><p>${x.text}</p></div></div>`).join('')}</div><div class="trust-strip"><strong>↗</strong><span>Ditto can say “keep what you already have.” The recommendation is not ranked by payout.</span></div><div class="actions"><button class="btn teal" data-action="advisor">Request human review</button><button class="btn secondary" data-view="choose">Explore Choose</button></div><div class="note">A real verdict would need the complete policy, consented data, and sign-off by a qualified adviser. No file or financial information is sent from this demo.</div></section></div>`}
  function chooseView(){const selected=planData.find(p=>p.id===state.selected);return heading('02 / When you buy','Choose with the trade-offs visible','Compare an illustrative family shortlist ranked by claim outcomes and fit. Select a plan to see why it appears in that position.','Unbiased shortlist')+`<div class="choose-layout"><section class="card pad"><div class="card-header"><h2>Your family’s stated need</h2><span class="small-tag">ILLUSTRATIVE PLANS</span></div><div class="context-row"><span class="context-chip">₹1 Cr term cover</span><span class="context-chip">₹15L health cover</span><span class="context-chip">Family of 3</span></div><div class="plan-list">${planData.map((p,i)=>`<article class="plan ${p.id===state.selected?'selected':''}"><div><h3>Plan ${p.id} ${i===0?'<span class="small-tag">BEST FIT</span>':''}</h3><p>${p.cover}<br>${p.detail}</p></div><div class="score"><b>${p.score.toFixed(1)}</b><span>Claims Index / 10</span><div class="tiny-bar"><span style="width:${p.score*10}%"></span></div></div><button data-plan="${p.id}" type="button" aria-pressed="${p.id===state.selected}">${p.id===state.selected?'Selected':'Compare'}</button></article>`).join('')}</div><div class="score-legend"><span>Higher score = stronger illustrative paid-claim outcomes</span><span>Rank is locked, not sponsored</span></div><div class="note">Plan names and scores are fictional demo data. In the proposed model the Index would be built from verified claim outcomes and audited for quality.</div></section><aside class="card pad"><div class="card-header"><h2>Why Plan ${selected.id}?</h2><span class="small-tag">EXPLAINED</span></div><div class="explain"><h3>Fit and outcome, not placement</h3><p>${selected.why}</p></div><div class="ledger"><div><span>Claims Index</span><b>${selected.score.toFixed(1)} / 10</b></div><div><span>Cover in this option</span><b>${selected.id==='C'?'₹10L health':'₹15L health'}</b></div><div><span>Ditto earnings</span><b>Same % across options</b></div><div><span>Paid placement</span><b>None</b></div></div><div class="trust-strip"><strong>✓</strong><span>An adviser signs the final shortlist. You can ask why an option was included or excluded.</span></div><div class="actions"><button class="btn primary" data-action="advisor">Discuss with an adviser</button></div></aside></div>`}
  function claimView(){const status=state.claimResolved?'Settled':'Review in progress';return heading('03 / When it matters','A named advocate at claim','Follow an illustrative ₹1.8L hospitalisation claim. Ditto contests an unexplained deduction and stays with the case to settlement.','Claim Shield')+`<div class="claim-layout"><section class="card pad"><div class="claim-hero"><div><span>Hospitalisation claim</span><b>₹1.8L</b></div><strong>${status}</strong></div><div class="timeline"><div class="step"><span class="step-dot">✓</span><div><h3>Claim filed with the insurer</h3><p>Case and supporting documents submitted.</p></div></div><div class="step"><span class="step-dot">✓</span><div><h3>Documents pre-checked</h3><p>Ditto reviews the policy terms and hospital documents.</p></div></div><div class="step warning"><span class="step-dot">!</span><div><h3>Insurer deducts ₹42K</h3><p>Potential mismatch between the deduction and policy wording.</p></div></div><div class="step"><span class="step-dot">↗</span><div><h3>Ditto challenges the deduction</h3><p>A named advocate compiles the clause and evidence trail.</p></div></div><div class="step success"><span class="step-dot">✓</span><div><h3>₹1.71L paid</h3><p>Illustrative settled amount after review.</p></div></div></div><div class="actions"><button class="btn secondary" data-action="claim-details">${state.claimExpanded?'Hide':'See'} the challenge</button><button class="btn ghost" data-action="reset-claim">Replay claim journey</button></div>${state.claimExpanded?`<div class="appeal"><h3>What the advocate did</h3><p>Checked the schedule and exclusions, identified the clause relevant to the deduction, asked the insurer for a written calculation, then escalated the disputed amount with the supporting documents. Any further appeal would follow the insurer’s grievance process and the available Ombudsman route.</p></div>`:''}</section><aside class="card pad"><div class="status-panel"><div class="eyebrow" style="color:#0b847a">Claim Shield</div><h3>Support even if you bought elsewhere</h3><p>This proposed membership follows the policyholder, not a particular insurer or point of purchase.</p></div><div class="contact"><div class="avatar">DA</div><div><b>Your Ditto advocate</b><span>Named human owner · demo case</span></div></div><div class="case-log"><h3>Case record</h3><p>Every document, insurer response, action and decision stays in a visible timeline. Claim outcomes can improve the aggregate Claims Index only after privacy safeguards.</p></div><div class="ledger"><div><span>Claim requested</span><b>₹1.80L</b></div><div><span>Initial deduction</span><b>₹42K</b></div><div><span>Final paid (demo)</span><b style="color:var(--teal)">₹1.71L</b></div></div><button class="btn teal" style="width:100%;margin-top:14px" data-action="claim-help">Ask about Claim Shield</button><p class="micro" style="margin-top:11px">Illustrative case and amount. The proposed service and pricing depend on regulatory review.</p></aside></div>`}
  function insideView(){return heading('04 / Embedded with partners','Ditto Inside, on your terms','An advice widget appears within a partner investing app. The partner can offer access but cannot edit the recommendation or use your data without consent.','Partner experience')+`<div class="inside-layout"><section class="partner-shell" aria-label="Illustrative partner app"><div class="partner-top"><span>northstar <span style="font-weight:450;color:#b9c8e6">invest</span></span><small>Portfolio</small></div><div class="balance"><span>Portfolio value · illustrative</span><strong>₹8,40,000</strong><div class="fake-bars" aria-hidden="true"><i style="height:30%"></i><i style="height:65%"></i><i style="height:42%"></i><i style="height:82%"></i><i style="height:60%"></i><i style="height:100%"></i></div></div><div class="widget"><span class="widget-badge">ADVICE BY DITTO</span><h2>Before you invest more, is your family protected?</h2><p>Check the cover you already have, without changing how you invest.</p><ul><li><em>✓</em> Partner cannot edit your shortlist</li><li><em>✓</em> You choose what data is shared</li><li><em>✓</em> Claim support stays with Ditto</li></ul><button class="btn primary" type="button" data-action="inside-start">Check my cover →</button></div></section><section class="card pad"><div class="card-header"><h2>Your data permission</h2><span class="small-tag">YOU CONTROL IT</span></div><p class="subtle">The example works without account data. Turn on demo consent to see the proposed hand-off; no account is connected.</p><div class="consent-row"><div><b>Allow a one-time financial snapshot</b><p>Balance and existing cover, only for this review. This toggle stores nothing on a server.</p></div><button class="switch" type="button" role="switch" aria-checked="${state.consent}" aria-label="Allow demo financial snapshot" data-action="toggle-consent"></button></div><div class="consent-row"><div><b>Use claim outcomes in the Index</b><p>Only de-identified, aggregated outcomes. Separate from your review permission.</p></div><button class="switch" type="button" role="switch" aria-checked="${state.consentScope}" aria-label="Allow demo aggregate claim outcomes" data-action="toggle-scope"></button></div><div class="scope-list"><div><span>✓</span> Ditto owns the advice and final verdict</div><div><span>✓</span> Partner receives a hand-off status, not your full policy analysis</div><div><span>✓</span> One-tap revocation ends future access in the proposed model</div></div><div class="${state.consent?'trust-strip':'empty'}">${state.consent?'Demo consent active. You can revoke it here at any time.':'No account data shared. You can still start with manual inputs.'}</div><div class="actions"><button class="btn ghost" type="button" data-action="revoke">Revoke all demo permissions</button></div><p class="micro" style="margin-top:13px">Account Aggregator, policy access and partner integration are proposed future capabilities, not live connections in this prototype.</p></section></div>`}
  function render(){renderNav();$('#view').innerHTML=({check:checkView,choose:chooseView,claim:claimView,inside:insideView})[state.view]();document.title=`${views.find(v=>v[0]===state.view)[1]} · Ditto On Your Side`;window.scrollTo({top:0,behavior:'auto'})}
  function modal(title,content){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=content;$('#modalBackdrop').classList.add('open');$('#closeModal').focus()}
  function closeModal(){$('#modalBackdrop').classList.remove('open')}
  function charter(){modal('The Independence Charter',`<p>Five proposed controls make consumer-first advice testable, rather than a brand claim.</p><ol class="charter-list"><li><b>01</b><span><strong>Buyer-side broker licence</strong><br>Seek access across insurers and legally act for the client.</span></li><li><b>02</b><span><strong>Commission-blind adviser pay</strong><br>Advisers do not earn more for a particular policy.</span></li><li><b>03</b><span><strong>No paid placement</strong><br>Shortlists use suitability and verified claim outcomes.</span></li><li><b>04</b><span><strong>Show Ditto’s earnings</strong><br>Make the payment on every option visible.</span></li><li><b>05</b><span><strong>Publish the proof</strong><br>Independent audit and a keep-rate, including advice to retain existing cover.</span></li></ol><p style="font-size:11px">These are proposed future commitments from the case strategy, not a statement of current Ditto operations.</p>`)}
  document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;history.replaceState(null,'','#'+state.view);render();return}const plan=e.target.closest('[data-plan]');if(plan){state.selected=plan.dataset.plan;render();return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'charter':charter();break;case'reset-check':state.scenario={product:'Savings-linked life plan',cover:10,income:12,premium:1,dependants:'Yes'};evaluate();render();toast('Example inputs restored.');break;case'advisor':modal('Human review, by design','<p>This prototype does not send a request. In the proposed service, a qualified Ditto adviser checks the complete policy, explains the verdict, and signs off before it is shared.</p><p>The recommendation can be Keep, Fix or Switch, including advice to retain a policy bought elsewhere.</p>');break;case'claim-details':state.claimExpanded=!state.claimExpanded;render();break;case'reset-claim':state.claimExpanded=false;render();toast('Claim journey reset to the example.');break;case'claim-help':modal('Claim Shield','<p>Claim Shield is a proposed membership for help with policies bought anywhere. An advocate would review deductions, keep a case record, and help you use the insurer grievance process when needed.</p><p>The deck’s ₹999 per family per year is a team assumption. Service structure and fee permissibility require regulatory review.</p>');break;case'toggle-consent':state.consent=!state.consent;render();toast(state.consent?'Demo permission on. No real account was connected.':'Demo permission revoked.');break;case'toggle-scope':state.consentScope=!state.consentScope;render();toast(state.consentScope?'Aggregate outcome permission on.':'Aggregate outcome permission revoked.');break;case'revoke':state.consent=false;state.consentScope=false;render();toast('All demo permissions revoked.');break;case'inside-start':state.view='check';history.replaceState(null,'','#check');render();toast('Partner hand-off complete. You can review manually.');break;}});
  document.addEventListener('submit',e=>{if(e.target.id!=='checkForm')return;e.preventDefault();const data=new FormData(e.target),cover=Number(data.get('cover')),income=Number(data.get('income')),premium=Number(data.get('premium'));if(!Number.isFinite(cover)||!Number.isFinite(income)||!Number.isFinite(premium)||cover<=0||income<=0||premium<=0){toast('Enter positive numbers for cover, income, and premium.');return}state.scenario={product:String(data.get('product')),cover,income,premium,dependants:String(data.get('dependants'))};evaluate();render();toast('Pitch reviewed using the displayed demo rules.');});
  $('#closeModal').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});const hash=location.hash.slice(1);if(views.some(v=>v[0]===hash))state.view=hash;render();
})();
</script>
</body>
</html>
